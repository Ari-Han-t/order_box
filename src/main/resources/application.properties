# Stock Exchange Application Configuration
server.port=8085
server.host=0.0.0.0

# Database Configuration (Defaults to MySQL, with intelligent automatic fallback to H2)
# Environment variables DB_URL, DB_USER, DB_PASSWORD take precedence
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/stock_exchange?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root

# Embedded Fallback DB (Used if MySQL is unavailable)
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:mem:stock_exchange;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.fallback.user=sa
db.fallback.password=

# Connection Pool Settings
db.pool.maxSize=15
db.pool.minIdle=3
db.pool.connectionTimeoutMs=3000
